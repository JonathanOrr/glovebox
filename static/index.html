<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeslaCam Viewer</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="side-head">
      <div class="side-title"><h1>TeslaCam</h1>
        <div class="views" id="views"><button data-v="player" class="on">Player</button><button data-v="map">Map</button></div></div>
      <div class="meta" id="summary">Loading…</div>
      <div class="filters" id="filters"></div>
    </div>
    <div id="list"></div>
    <div class="help"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> 5s · <kbd>,</kbd><kbd>.</kbd> frame · <kbd>↑</kbd><kbd>↓</kbd> event · <kbd>1</kbd>–<kbd>6</kbd> solo cam · <kbd>Del</kbd> delete · <kbd>M</kbd> map · <kbd>V</kbd> 360°</div>
  </aside>
  <main id="main"><div class="empty">Select an event</div></main>
</div>

<template id="viewer">
  <div class="topbar">
    <div>
      <div class="title" id="evTitle"></div>
      <div class="sub" id="evSub"></div>
    </div>
    <div class="spacer"></div>
    <button id="panoBtn" title="360° view from all cameras (V)">360°</button>
    <button id="mapBtn" title="Show or hide the follow map (M)">Map</button>
    <button id="delBtn" class="danger" title="Delete this event from the USB drive (Del)">Delete event</button>
  </div>
  <div class="stage-row">
    <div class="stage" id="stage"></div>
    <div class="follow" id="follow"></div>
  </div>
  <div class="hud" id="hud"></div>
  <div class="controls">
    <button id="playBtn" style="width:70px">▶ Play</button>
    <div class="time" id="timeLbl">0:00 / 0:00</div>
    <canvas id="timeline"></canvas>
    <div class="rates" id="rates"></div>
  </div>
</template>

<script type="module" src="/js/app.js"></script>
</body>
</html>
